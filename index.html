<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Escáner de Inventario</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
      margin-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: #111827;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .success {
      background: #15803d;
      color: white;
    }

    .estado {
      padding: 12px;
      margin-top: 12px;
      border-radius: 12px;
      text-align: center;
      background: #f3f4f6;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .codigo {
      padding: 15px;
      margin-top: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: #dcfce7;
      color: #166534;
      word-break: break-all;
    }

  </style>

</head>


<body>

<div class="app">

  <div class="card">

    <h1>📷 Escáner de Inventario</h1>

    <div>
      Apunta la cámara al código de barras o QR.
    </div>

  </div>


  <div class="card">

    <div id="reader"></div>


    <button
      class="primary"
      onclick="iniciarCamara()">

      📷 ACTIVAR CÁMARA

    </button>


    <button
      class="secondary"
      onclick="detenerCamara()">

      ⏹ DETENER CÁMARA

    </button>


    <div
      id="estado"
      class="estado">

      Presiona "Activar cámara".

    </div>


    <div
      id="codigo"
      class="codigo"
      style="display:none">
    </div>


    <button
      id="volver"
      class="success"
      style="display:none"
      onclick="volverInventario()">

      ↩️ VOLVER AL INVENTARIO

    </button>

  </div>

</div>


<script>

let scanner = null;
let camaraActiva = false;
let codigoDetectado = '';

/* ==========================================
   ACTIVAR CÁMARA
========================================== */
async function iniciarCamara() {

  if (typeof Html5Qrcode === 'undefined') {
    mostrarEstado('No se pudo cargar la librería del lector.', true);
    return;
  }

  mostrarEstado('Iniciando cámara...', false);

  if (scanner) {
    try {
      if (camaraActiva) {
        await scanner.stop();
      }
      await scanner.clear();
    } catch (e) {
      console.log('Limpiando escáner previo:', e);
    }
    scanner = null;
    camaraActiva = false;
  }

  scanner = new Html5Qrcode('reader');

  const configuracion = {
    fps: 10,
    qrbox: function(width, height) {
      const size = Math.min(width, height) * 0.70;
      return { width: size, height: size };
    },
    aspectRatio: 1.0
  };

  scanner.start(
    { facingMode: 'environment' },
    configuracion,
    function(texto) {
      codigoEncontrado(texto);
    },
    function(error) {
      // Ignorar errores continuos de escaneo
    }
  )
  .then(function() {
    camaraActiva = true;
    mostrarEstado('📷 Cámara activa. Apunta al código.', false);
  })
  .catch(function(error) {
    camaraActiva = false;
    console.error(error);
    mostrarEstado(
      'No se pudo activar la cámara. Verifica los permisos del navegador.',
      true
    );
  });
}

/* ==========================================
   CÓDIGO ENCONTRADO (AUTOMÁTICO)
========================================== */
function codigoEncontrado(texto) {

  texto = String(texto || '').trim();

  if (!texto || codigoDetectado === texto) return;

  codigoDetectado = texto;

  document.getElementById('codigo').textContent = 'Código detectado: ' + texto;
  document.getElementById('codigo').style.display = 'block';
  document.getElementById('volver').style.display = 'block';

  mostrarEstado('✅ Código detectado. Redirigiendo...', false);

  // Detenemos la cámara y redirigimos inmediatamente
  detenerYRedirigir();
}

/* ==========================================
   DETENER CÁMARA
========================================== */
function detenerCamara() {
  if (!scanner || !camaraActiva) return;

  scanner.stop()
    .then(function() { camaraActiva = false; })
    .catch(function(error) { console.log(error); camaraActiva = false; });
}

/* ==========================================
   VOLVER AL INVENTARIO (FORZADO)
========================================== */
function detenerYRedirigir() {
  const inventarioUrl =
    'https://script.google.com/macros/s/AKfycby4w64q3aolM1FFl6DxfI4o5LZj9ErJmSFEFvn6sSAGcYN6xMLRNCRiiBrpU1E1BKwUEg/exec';

  const destino = inventarioUrl + '?codigo=' + encodeURIComponent(codigoDetectado);

  const irADestino = function() {
    if (window.top) {
      window.top.location.href = destino;
    } else {
      window.location.href = destino;
    }
  };

  if (scanner && camaraActiva) {
    scanner.stop()
      .then(function() {
        camaraActiva = false;
        setTimeout(irADestino, 300);
      })
      .catch(function(err) {
        camaraActiva = false;
        irADestino();
      });
  } else {
    irADestino();
  }
}

function volverInventario() {
  if (!codigoDetectado) return;
  detenerYRedirigir();
}

/* ==========================================
   MENSAJE
========================================== */
function mostrarEstado(texto, error) {
  const elemento = document.getElementById('estado');
  elemento.textContent = texto;
  elemento.className = error ? 'estado error' : 'estado';
}

</script>

</body>

</html>
